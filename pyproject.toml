[build-system] # Require setuptool version due to https://github.com/pypa/setuptools/issues/2938
requires = [
    "setuptools>=77.0.3", # Ensuring license field is correctly parsed]
    "wheel",
]

[project]
name = "sumfem"
version = "0.1.0.dev0"
description = "RedOx flow battery interface for FEniCSx"
authors = [
    { name = "Jørgen S. Dokken", email = "dokken@simula.no" },
    { name = "Amirhossein Aghabarari", email = "amirhossein.aghabarari@nmbu.no" },
    { name = "Henrik N.T. Finsberg", email = "henriknf@simula.no" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # DOLFINx main, for its fixes of mixed-dimensional and manifold assembly
    "fenics-dolfinx>=0.12.0.dev0",
    "numpy",
    "sympy",
    # Not yet on PyPI. It blocks publishing sumfem to PyPI until released there.
    # A git reference takes no version bound, so the tag of the oldest supported
    # release stands for ">=1.0.0" until then.
    "ufl-units @ git+https://github.com/fenics-dolfiny/ufl-units@v1.0.0",
]


[project.optional-dependencies]
test = ["pytest", "sympy", "jax", "scifem", "gmsh"]
examples = ["matplotlib", "scipy", "gmsh"]
dev = ["pdbpp", "ipython", "mypy", "ruff"]
docs = ["sumfem[examples]", "jupyter-book<2", "jupytext", "sphinx-codeautolink"]
jupyter = ["trame_jupyter_extension", "trame", "pyvista[all]>=0.45.0"]
all = [
    "sumfem[test]",
    "sumfem[examples]",
    "sumfem[dev]",
    "sumfem[docs]",
    "sumfem[jupyter]",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
# Folders to exclude
exclude = ["docs/", "build/"]
# Folder to check with mypy
files = ["src", "tests"]

[tool.ruff]
src = ["src", "docs", "tests", "examples"]
indent-width = 4

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I001",
]


[tool.ruff.lint.isort]
known-first-party = ["sumfem"]
known-third-party = [
    "basix",
    "dolfinx",
    "ffcx",
    "ufl",
    "gmsh",
    "numpy",
    "pytest",
    "pyadjoint",
    "dolfinx_external_operator",
]
section-order = [
    "future",
    "standard-library",
    "mpi",
    "petsc",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"mpi" = ["mpi4py"]
"petsc" = ["petsc4py"]
