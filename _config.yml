# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: "sumfem: reusable, summable variational models for FEniCSx"
author: Jørgen S. Dokken, Amirhossein Aghabarari
copyright: "2026"

execute:
  execute_notebooks: cache
  # Seconds each cell of a tutorial or demo may run for
  timeout: 600

only_build_toc_files: true
exclude_patterns:
  - ".pytest_cache/*"
  # Python scripts of CI, which are not pages
  - ".github/*"
  # Issues and patches for upstream projects, which are not pages
  - "upstream/*"
  - "**/.ipynb_checkpoints"

# Information about where the book exists on the web
repository:
  url: https://github.com/scientificcomputing/sumfem # Online location of your book
  branch: main # Which branch of the repository should be used when creating links (optional)

bibtex_bibfiles:
  - references.bib

launch_buttons:
  notebook_interface: "jupyterlab" # The interface interactive links will activate ["classic", "jupyterlab"]
  binderhub_url: "https://mybinder.org"

html:
  use_issues_button: true
  use_repository_button: true

parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath
    - linkify
    - html_admonition
    - html_image

sphinx:
  extra_extensions:
    - "sphinx.ext.autodoc"
    - "sphinx.ext.napoleon"
    - "sphinx.ext.viewcode"
    - "sphinx.ext.intersphinx"
    - sphinx_codeautolink

  config:
    html_theme_options:
      navigation_with_keys: false
      navbar_persistent: []
    nb_custom_formats:
      .py:
        - jupytext.reads
        - fmt: py
    # A tutorial or demo that raises fails the build, instead of a warning
    nb_execution_raise_on_error: true
    # Pages that cite references cited elsewhere too list them as footnotes,
    # {footcite} and {footbibliography}. MyST checks footnotes before
    # sphinxcontrib-bibtex creates them, and warns about each; the book has
    # no MyST footnotes of its own
    suppress_warnings: ["myst.footnote"]
    # No rule before the footnotes, which end a page under References
    myst_footnote_transition: false
    autodoc_member_order: bysource
    # The page tables of contents list objects by name, without their module
    toc_object_entries_show_parents: hide
    autodoc_typehints: description
    codeautolink_concat_default: True
    intersphinx_mapping:
      python: ["https://docs.python.org/3", null]
      basix: ["https://docs.fenicsproject.org/basix/main/python/", null]
      ffcx: ["https://docs.fenicsproject.org/ffcx/main/", null]
      ufl: ["https://docs.fenicsproject.org/ufl/main/", null]
      dolfinx: ["https://docs.fenicsproject.org/dolfinx/main/python", null]
      sympy: ["https://docs.sympy.org/latest/", null]
      numpy: ["https://numpy.org/doc/stable/", null]
      scipy: ["https://docs.scipy.org/doc/scipy/", null]
      petsc4py: ["https://petsc.org/release/petsc4py", null]
      mpi4py: ["https://mpi4py.readthedocs.io/en/stable", null]
